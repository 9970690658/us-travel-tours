<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Reset Password | U.S TRAVEL & TOURS</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

    <link
        rel="stylesheet"
        href="../css/auth.css"
    >

</head>

<body>

    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="main-header">

        <div class="container nav-container">

            <a
                href="index.html"
                class="brand-logo"
            >
                <img
                    src="../assets/images/logo-1.png.jpeg"
                    alt="U.S TRAVEL & TOURS"
                >
            </a>

            <nav class="main-nav">

                <a href="index.html">Home</a>

                <a href="about.html">About</a>

                <a href="services.html">Services</a>

                <a href="visa.html">Visa</a>

                <a href="contact.html">Contact</a>

            </nav>

        </div>

    </header>


    <!-- =====================================================
         RESET PASSWORD
    ====================================================== -->

    <main>

        <section class="auth-page-section section-padding">

            <div class="container">

                <div class="auth-wrapper">

                    <div class="auth-card reset-password-card">

                        <div class="auth-header">

                            <div class="reset-icon">
                                <i class="fa-solid fa-lock"></i>
                            </div>

                            <h1>
                                Reset Password
                            </h1>

                            <p>
                                Create a new password for your U.S TRAVEL & TOURS account.
                            </p>

                        </div>


                        <form
                            id="resetPasswordForm"
                            novalidate
                        >

                            <!-- NEW PASSWORD -->

                            <div class="form-group">

                                <label for="resetPassword">
                                    New Password
                                </label>

                                <div class="password-wrapper">

                                    <input
                                        type="password"
                                        id="resetPassword"
                                        name="password"
                                        placeholder="Enter new password"
                                        autocomplete="new-password"
                                        required
                                    >

                                    <button
                                        type="button"
                                        class="password-toggle"
                                        data-password-toggle
                                        aria-label="Show password"
                                    >
                                        <i class="fa-regular fa-eye"></i>
                                    </button>

                                </div>

                            </div>


                            <!-- CONFIRM PASSWORD -->

                            <div class="form-group">

                                <label for="resetConfirmPassword">
                                    Confirm New Password
                                </label>

                                <div class="password-wrapper">

                                    <input
                                        type="password"
                                        id="resetConfirmPassword"
                                        name="confirmPassword"
                                        placeholder="Confirm new password"
                                        autocomplete="new-password"
                                        required
                                    >

                                    <button
                                        type="button"
                                        class="password-toggle"
                                        data-password-toggle
                                        aria-label="Show password"
                                    >
                                        <i class="fa-regular fa-eye"></i>
                                    </button>

                                </div>

                            </div>


                            <!-- PASSWORD RULE -->

                            <div class="password-hint">

                                <i class="fa-solid fa-circle-info"></i>

                                <span>
                                    Use at least 8 characters with letters and numbers.
                                </span>

                            </div>


                            <!-- MESSAGE -->

                            <div
                                id="resetPasswordMessage"
                                class="auth-message"
                                style="display:none;"
                            ></div>


                            <!-- SUBMIT -->

                            <button
                                type="submit"
                                id="resetPasswordSubmitBtn"
                                class="btn btn-primary reset-password-btn"
                            >
                                <span class="reset-btn-text">
                                    Reset Password
                                </span>

                            </button>

                        </form>


                        <div class="auth-footer">

                            <a href="login.html">
                                <i class="fa-solid fa-arrow-left"></i>
                                Back to Login
                            </a>

                        </div>

                    </div>

                </div>

            </div>

        </section>

    </main>


    <script src="../js/main.js"></script>

    <script src="../js/auth.js"></script>

</body>

</html>
